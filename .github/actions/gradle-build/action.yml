name: Gradle build
description: >-
  Validerer Gradle-wrapperen, setter opp Java og kjører ./gradlew build.
  Brukes av både prs.yml og master.yml, slik at endringer i byggoppsettet testes på PR før de når master.
  Krever at repoet er sjekket ut på forhånd.

runs:
  using: composite
  steps:
    - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - name: test and build
      shell: bash
      run: ./gradlew build

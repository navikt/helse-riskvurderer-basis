version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "⬆️ "
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "gradle"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
